name: Publish MassAI v0.7.0 Release

on:
  push:
    branches: [ "massai-v0.1-poc" ]
    paths:
      - ".github/workflows/release-v0.7.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build release
        run: gradle clean testDebugUnitTest :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Rename outputs
        run: |
          cp app/build/outputs/apk/release/app-release.apk MassAI-v0.7.0-release.apk
          cp app/build/outputs/bundle/release/app-release.aab MassAI-v0.7.0-release.aab

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.7.0 >/dev/null 2>&1; then
            gh release upload v0.7.0 MassAI-v0.7.0-release.apk MassAI-v0.7.0-release.aab --clobber
          else
            gh release create v0.7.0 \
              MassAI-v0.7.0-release.apk \
              MassAI-v0.7.0-release.aab \
              --title "MassAI v0.7.0" \
              --notes "Guide hélicoïdal 3 niveaux : la trace reste ouverte jusqu'à couverture suffisante, puis l'anneau supérieur apparaît. Les transitions verticales sont exclues de la reconstruction. Les scans multi-niveaux utilisent davantage de candidates et une sélection circulaire par angle." \
              --target "$GITHUB_SHA"
          fi
