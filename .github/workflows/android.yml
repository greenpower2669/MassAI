name: Build MassAI Release

on:
  push:
    branches: [ "massai-v0.1-poc" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build release
        run: gradle clean testDebugUnitTest :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Rename outputs
        run: |
          cp app/build/outputs/apk/release/app-release.apk MassAI-v0.4.0-release.apk
          cp app/build/outputs/bundle/release/app-release.aab MassAI-v0.4.0-release.aab

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: MassAI-v0.4.0-release
          path: |
            MassAI-v0.4.0-release.apk
            MassAI-v0.4.0-release.aab
          if-no-files-found: error
