name: Publish MassAI v0.1 Release

on:
  push:
    branches: [ "massai-v0.1-poc" ]
    paths:
      - ".github/workflows/release-v0.1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MassAI-v0.1-debug.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1 >/dev/null 2>&1; then
            gh release upload v0.1 MassAI-v0.1-debug.apk --clobber
          else
            gh release create v0.1 MassAI-v0.1-debug.apk \
              --title "MassAI v0.1" \
              --notes "POC Android initial de MassAI : saisie taille/poids, capture vidéo et import vidéo. Cette version ne réalise pas encore la reconstruction photogrammétrique 3D." \
              --target "$GITHUB_SHA"
          fi
