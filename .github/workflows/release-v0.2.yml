name: Publish MassAI v0.2.0 Release

on:
  push:
    branches: [ "massai-v0.1-poc" ]
    paths:
      - ".github/workflows/release-v0.2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MassAI-v0.2-debug.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            gh release upload v0.2.0 MassAI-v0.2-debug.apk --clobber
          else
            gh release create v0.2.0 MassAI-v0.2-debug.apk \
              --title "MassAI v0.2.0" \
              --notes "POC Android : caméra CameraX intégrée, import vidéo robuste, extraction réelle de frames candidates, interface pipeline complète et zone de contrôle du futur maillage 3D. Le moteur de reconstruction 3D n'est pas encore branché." \
              --target "$GITHUB_SHA"
          fi
