name: Validate MassAI v1.2.0-beta1
on:
  push:
    branches: [ "massai-v1.2-stabilisation" ]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and experimental Android builds
        run: gradle clean testDebugUnitTest :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Name experimental outputs
        run: |
          cp app/build/outputs/apk/release/app-release.apk MassAI-v1.2.0-beta1-experimental.apk
          cp app/build/outputs/bundle/release/app-release.aab MassAI-v1.2.0-beta1-experimental.aab
      - uses: actions/upload-artifact@v4
        with:
          name: MassAI-v1.2.0-beta1-experimental
          path: |
            MassAI-v1.2.0-beta1-experimental.apk
            MassAI-v1.2.0-beta1-experimental.aab
          if-no-files-found: error
